  </g>

  <!-- scale -->
  <g stroke="#999" stroke-width="1" font-size="9" fill="#666">
    <line x1="70" y1="222" x2="70" y2="228"/><text x="66" y="240">0</text>
    <line x1="250" y1="222" x2="250" y2="228"/><text x="242" y="240">30</text>
