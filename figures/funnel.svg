    <!-- 9/29 -->
    <text x="24" y="202" fill="#333">9/29</text>
    <rect x="70" y="186" width="420" height="20" rx="3" fill="#d8e8f8" stroke="#8ab4d8"/>
    <rect x="70" y="186" width="42" height="20" fill="#e88"/>
