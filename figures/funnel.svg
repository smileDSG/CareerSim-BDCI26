  <text x="70" y="256" font-size="10" fill="#666">每个横条 = 当日全赛道分数分布；水位越高说明越接近天际。红色段 = 判 0 的队（不计入最高分）。</text>

  <!-- our scores -->
  <rect x="24" y="276" width="632" height="44" rx="8" fill="#f0f8f0" stroke="#4a9a5a" stroke-width="1.5"/>
  <text x="40" y="295" font-size="11.5" font-weight="700" fill="#1a5a2a">我们的四件</text>
  <text x="40" y="312" font-size="11" fill="#2a6a3a">38 　→　 39 　→　 42 　→　 56　　｜　56 = v55b，距当日榜首 63.31 只差 6.62（前 31%）</text>

